name: gate

# The gate has to be a fact, not a claim.
#
# Until this file existed, "the gate passed" meant someone ran it locally and
# said so. Every green result reported during development was that kind. This
# makes GitHub refuse a commit that has not passed.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci, not npm install: it installs from the lockfile exactly and fails
      # if package.json and the lockfile disagree. That disagreement has broken
      # this repository twice, and both times only a clean checkout revealed it.
      - name: Install from the lockfile
        run: npm ci

      - name: Gate
        run: npm run gate

      # A clean checkout is where the real defects showed up: a stale lockfile, a
      # .git file-vs-directory assumption, and a prepare script that broke npm ci
      # were all invisible to a developed tree.
      - name: Working tree unchanged by the gate
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The gate modified tracked files or left artifacts behind:"
            git status --porcelain
            exit 1
          fi

  # A separate job on purpose. It installs from the network and takes minutes,
  # so keeping it out of `npm run gate` keeps the local loop fast — but running
  # it in parallel here means it is not optional either.
  consumer-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      # Everything in the gate resolves package names to SOURCE, through
      # tsconfig path aliases and project references. A consumer gets a tarball
      # and `files`/`main`/`types` instead, and a package can pass the whole gate
      # while being unusable the moment it is installed.
      - name: Packages work when installed
        run: npm run check:pack
