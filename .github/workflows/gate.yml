name: gate

# The gate has to be a fact, not a claim.
#
# Until this file existed, "the gate passed" meant someone ran it locally and
# said so. Every green result reported during development was that kind. This
# makes GitHub refuse a commit that has not passed.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci, not npm install: it installs from the lockfile exactly and fails
      # if package.json and the lockfile disagree. That disagreement has broken
      # this repository twice, and both times only a clean checkout revealed it.
      - name: Install from the lockfile
        run: npm ci

      - name: Gate
        run: npm run gate

      # A clean checkout is where the real defects showed up: a stale lockfile, a
      # .git file-vs-directory assumption, and a prepare script that broke npm ci
      # were all invisible to a developed tree.
      - name: Working tree unchanged by the gate
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The gate modified tracked files or left artifacts behind:"
            git status --porcelain
            exit 1
          fi
